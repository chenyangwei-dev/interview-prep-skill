name: Code coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and coverage dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage reportlab pdfplumber pypdf python-docx

      - name: Run tests with coverage
        run: python -m coverage run --branch --source=scripts -m unittest discover -s tests -p "test_*.py" -v

      - name: Print coverage summary
        run: python -m coverage report --show-missing

      - name: Generate XML coverage report
        run: python -m coverage xml -o coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
