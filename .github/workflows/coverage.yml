name: Code coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and coverage dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "coverage>=7.10" reportlab pdfplumber pypdf python-docx
          python -m pip install -r requirements-langgraph.txt

      - name: Run unit tests with coverage
        run: python -m coverage run -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Run regression tests with coverage
        run: python -m coverage run -m unittest discover -s tests/regression -p "test_*.py" -v

      - name: Combine parent and subprocess coverage
        run: python -m coverage combine

      - name: Run deterministic eval suite
        run: python evals/run_eval.py --use-samples --require-all --output work/eval-results.json

      - name: Print coverage summary
        run: python -m coverage report --fail-under=80

      - name: Generate XML coverage report
        run: python -m coverage xml -o coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
